name: Plandex native MCP safety contracts
on:
  push:
    branches:
      - feature/plandex-native-mcp-20261104
    paths:
      - 'persistd/**'
      - '.github/workflows/plandex-native-mcp-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: plandex-native-mcp-branch
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts
          npm --prefix persistd ci --ignore-scripts
      - name: Native MCP contract
        run: node --test persistd/plandex-native.test.js persistd/plandex-mcp.test.js
      - name: Root suite (Linux-compatible tests)
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' suites < <(find tests -maxdepth 1 -type f -name '*.test.js' ! -name 'fleet-installer-windows.test.js' -print0)
          node --test "${suites[@]}"
      - name: Full PersistFlow suite
        run: npm --prefix persistd test
  windows-installer-contract:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked root dependencies
        run: npm ci --ignore-scripts
      - name: Windows fleet installer contracts
        run: node --test tests/fleet-installer-windows.test.js

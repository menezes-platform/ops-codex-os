name: One-shot org Cloudflare credential probe

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-shot-cloudflare-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - shell: bash
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] && echo TOKEN_PRESENT || echo TOKEN_ABSENT
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && echo ACCOUNT_PRESENT || echo ACCOUNT_ABSENT

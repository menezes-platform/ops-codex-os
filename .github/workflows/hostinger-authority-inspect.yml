name: Hostinger Authority Inspect

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-authority-inspect
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: [self-hosted, windows, x64, hostinger-authority-probe-20261027]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect exact PersistFlow site without modifying production
        shell: powershell
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        run: node .github/scripts/hostinger-authority-inspect.cjs
